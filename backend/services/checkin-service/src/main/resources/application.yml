server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../../.env[.properties]
      - optional:file:backend/services/checkin-service/.env[.properties]
  application:
    name: checkin-service
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${ORACLE_USER:}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 10000
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}

services:
  reservation:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  key:
    url: ${KEY_SERVICE_URL:http://localhost:8084}
  admin:
    url: ${ADMIN_SERVICE_URL:http://localhost:8085}
  biometry:
    url: ${BIOMETRY_SERVICE_URL:http://localhost:8086}
  pms:
    url: ${PMS_SERVICE_URL:http://localhost:8087}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8091}

identity:
  verification:
    demo-auto-approve: ${IDENTITY_DEMO_AUTO_APPROVE:false}
    document-only-fallback-enabled: ${IDENTITY_DOCUMENT_ONLY_FALLBACK_ENABLED:true}
    ocr:
      api-key: ${OCR_SPACE_API_KEY:}
      timeout-seconds: ${OCR_SPACE_TIMEOUT_SECONDS:10}
    face-match:
      base-url: ${COMPREFACE_URL:}
      api-key: ${COMPREFACE_API_KEY:}
      threshold: ${COMPREFACE_THRESHOLD:85}
      timeout-seconds: ${COMPREFACE_TIMEOUT_SECONDS:10}

logging:
  level:
    br.com.fiap.flexcheck: INFO

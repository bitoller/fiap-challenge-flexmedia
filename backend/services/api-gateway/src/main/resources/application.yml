server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: api-gateway

services:
  checkin:
    url: ${CHECKIN_SERVICE_URL:http://localhost:8080}
  reservation:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  key:
    url: ${KEY_SERVICE_URL:http://localhost:8084}
  admin:
    url: ${ADMIN_SERVICE_URL:http://localhost:8085}
  device:
    url: ${DEVICE_SERVICE_URL:http://localhost:8089}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8090}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8091}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}


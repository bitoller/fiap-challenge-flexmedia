services:
  checkin-service:
    build:
      context: ./backend
      dockerfile: services/checkin-service/Dockerfile
    image: flexcheck/checkin-service:demo
    container_name: flexcheck-checkin-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      RESERVATION_SERVICE_URL: ${RESERVATION_SERVICE_URL:-http://reservation-service:8082}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8083}
      KEY_SERVICE_URL: ${KEY_SERVICE_URL:-http://key-service:8084}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin-service:8085}
      DEVICE_SERVICE_URL: ${DEVICE_SERVICE_URL:-http://device-service:8089}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8090}
      BIOMETRY_SERVICE_URL: ${BIOMETRY_SERVICE_URL:-http://biometry-service:8086}
      PMS_SERVICE_URL: ${PMS_SERVICE_URL:-http://pms-adapter-service:8087}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8091}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      PMS_MODE: ${PMS_MODE:-MOCK}
      PAYMENT_MODE: ${PAYMENT_MODE:-MOCK}
      BIOMETRY_MODE: ${BIOMETRY_MODE:-MOCK}
      KEY_ISSUER_MODE: ${KEY_ISSUER_MODE:-MOCK}
      IDENTITY_DEMO_AUTO_APPROVE: ${IDENTITY_DEMO_AUTO_APPROVE:-false}
      IDENTITY_DOCUMENT_ONLY_FALLBACK_ENABLED: ${IDENTITY_DOCUMENT_ONLY_FALLBACK_ENABLED:-true}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      COMPREFACE_URL: ${COMPREFACE_URL:-}
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
    ports:
      - "${CHECKIN_PORT:-8081}:8080"
    depends_on:
      - reservation-service
      - payment-service
      - key-service
      - admin-service
      - device-service
      - identity-service
      - biometry-service
      - pms-adapter-service
      - notification-service
    networks:
      - flexcheck-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    image: flexcheck/api-gateway:demo
    container_name: flexcheck-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      CHECKIN_SERVICE_URL: http://checkin-service:8080
      RESERVATION_SERVICE_URL: http://reservation-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      KEY_SERVICE_URL: http://key-service:8084
      ADMIN_SERVICE_URL: http://admin-service:8085
      DEVICE_SERVICE_URL: http://device-service:8089
      IDENTITY_SERVICE_URL: http://identity-service:8090
      BIOMETRY_SERVICE_URL: http://biometry-service:8086
      PMS_SERVICE_URL: http://pms-adapter-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8091
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    depends_on:
      - checkin-service
      - reservation-service
      - payment-service
      - key-service
      - admin-service
      - device-service
      - identity-service
      - biometry-service
      - pms-adapter-service
      - notification-service
    networks:
      - flexcheck-net

  kiosk-web:
    build:
      context: ./frontend/kiosk-web
      args:
        VITE_API_URL: ${KIOSK_API_URL:-/api/v1}
    image: flexcheck/kiosk-web:demo
    container_name: flexcheck-kiosk-web
    restart: unless-stopped
    ports:
      - "${KIOSK_PORT:-3000}:80"
    depends_on:
      - api-gateway
    networks:
      - flexcheck-net

  admin-web:
    build:
      context: ./frontend/admin-web
      args:
        VITE_API_URL: ${ADMIN_WEB_API_URL:-/api/v1}
    image: flexcheck/admin-web:demo
    container_name: flexcheck-admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-3001}:80"
    depends_on:
      - api-gateway
    networks:
      - flexcheck-net

  reservation-service:
    build:
      context: ./backend
      dockerfile: services/reservation-service/Dockerfile
    image: flexcheck/reservation-service:demo
    container_name: flexcheck-reservation-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${RESERVATION_PORT:-8082}:8082"
    networks:
      - flexcheck-net

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    image: flexcheck/payment-service:demo
    container_name: flexcheck-payment-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${PAYMENT_PORT:-8083}:8083"
    networks:
      - flexcheck-net

  key-service:
    build:
      context: ./backend
      dockerfile: services/key-service/Dockerfile
    image: flexcheck/key-service:demo
    container_name: flexcheck-key-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${KEY_PORT:-8084}:8084"
    networks:
      - flexcheck-net

  admin-service:
    build:
      context: ./backend
      dockerfile: services/admin-service/Dockerfile
    image: flexcheck/admin-service:demo
    container_name: flexcheck-admin-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8085
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-FlexCheck Administrator}
      DEVICE_SERVICE_URL: http://device-service:8089
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${ADMIN_PORT:-8085}:8085"
    networks:
      - flexcheck-net

  device-service:
    build:
      context: ./backend
      dockerfile: services/device-service/Dockerfile
    image: flexcheck/device-service:demo
    container_name: flexcheck-device-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8089
    ports:
      - "${DEVICE_PORT:-8089}:8089"
    networks:
      - flexcheck-net

  identity-service:
    build:
      context: ./backend
      dockerfile: services/identity-service/Dockerfile
    image: flexcheck/identity-service:demo
    container_name: flexcheck-identity-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8090
    ports:
      - "${IDENTITY_PORT:-8090}:8090"
    networks:
      - flexcheck-net

  biometry-service:
    build:
      context: ./backend
      dockerfile: services/biometry-service/Dockerfile
    image: flexcheck/biometry-service:demo
    container_name: flexcheck-biometry-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8086
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
    ports:
      - "${BIOMETRY_PORT:-8086}:8086"
    networks:
      - flexcheck-net

  pms-adapter-service:
    build:
      context: ./backend
      dockerfile: services/pms-adapter-service/Dockerfile
    image: flexcheck/pms-adapter-service:demo
    container_name: flexcheck-pms-adapter-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8087
      ORACLE_URL: ${ORACLE_URL:?set ORACLE_URL in .env}
      ORACLE_USER: ${ORACLE_USER:?set ORACLE_USER in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
    ports:
      - "${PMS_PORT:-8087}:8087"
    networks:
      - flexcheck-net

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    image: flexcheck/notification-service:demo
    container_name: flexcheck-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8091
    ports:
      - "${NOTIFICATION_PORT:-8091}:8091"
    networks:
      - flexcheck-net

  oracle-db:
    profiles:
      - oracle-local
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:latest-lite}
    container_name: flexcheck-oracle
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_SYS_PASSWORD}
      ORACLE_PDB: ${ORACLE_PDB:-FREEPDB1}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
      - "${ORACLE_EM_PORT:-5500}:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/oracle:/workspace/oracle:ro
      - ./database/oracle/init:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/${ORACLE_SYS_PASSWORD}@localhost:1521/${ORACLE_PDB:-FREEPDB1} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - flexcheck-net

volumes:
  oracle-data:

networks:
  flexcheck-net:
    driver: bridge
